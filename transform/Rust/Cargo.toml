[package]
name = "coreauto-transform"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "JSON, CSV, and XML transform helpers for Core Auto step scripts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
